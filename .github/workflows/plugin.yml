name: Build Ndless touchscreen plugin

on:
  push:
    branches: [touchscreen-input, master]
    paths:
      - 'tools/touchscreen_plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential cmake git zlib1g-dev libboost-program-options-dev

      - name: Clone Ndless SDK (with submodules)
        run: |
          git clone --recursive --depth 1 https://github.com/ndless-nspire/Ndless.git $HOME/ndless

      - name: Build Ndless SDK
        run: |
          # nspire-gcc / nspire-as / nspire-ld / make-prg are committed scripts
          # in ndless-sdk/bin and need to be on PATH BEFORE invoking the SDK
          # build (libsyscalls' crt0.S calls nspire-as during the build).
          export PATH=$HOME/ndless/ndless-sdk/bin:$PATH
          cd $HOME/ndless/ndless-sdk
          # Workaround: newer arm-none-eabi-newlib doesn't define PATH_MAX.
          # libsyscalls/stdlib.cpp uses it for realpath(); inject a default.
          sed -i '1i #ifndef PATH_MAX\n#define PATH_MAX 4096\n#endif' libsyscalls/stdlib.cpp
          # Build only what we need: libsyscalls (crt0 + syscall stubs),
          # thirdparty (nspire-io headers/lib), libndls (nl_osid/idle/etc),
          # and the genzehn host tool. Skip 'samples', 'system' and the
          # 'luna'/'zehn_loader' tools — extra deps, not needed by us.
          make -j$(nproc) build-libsyscalls build-thirdparty build-libndls
          make -C tools/genzehn
          echo "$HOME/ndless/ndless-sdk/bin" >> $GITHUB_PATH

      - name: Build plugin
        run: |
          which nspire-gcc nspire-ld nspire-as genzehn make-prg
          cd tools/touchscreen_plugin
          make
          ls -la fb_touchscreen.tns

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb_touchscreen-tns
          path: tools/touchscreen_plugin/fb_touchscreen.tns
          if-no-files-found: error
