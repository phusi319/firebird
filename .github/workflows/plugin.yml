name: Build Ndless touchscreen plugin

on:
  push:
    branches: [touchscreen-input, master]
    paths:
      - 'tools/touchscreen_plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin in Ndless SDK Docker image
        # ndless/ndless-sdk is the official image published by the Ndless
        # team. It contains the matching arm-none-eabi toolchain, a fully
        # built SDK at /ndless-sdk, and all wrapper scripts on PATH.
        # Building the SDK from source on a modern Ubuntu runner fails
        # repeatedly because newlib/binutils have moved on (PATH_MAX,
        # REVERSE in ldscript, libc/libsyscalls symbol clashes); this
        # image freezes the exact toolchain the SDK was authored against.
        run: |
          docker run --rm \
            -v "$PWD/tools/touchscreen_plugin:/work" \
            -w /work \
            ndless/ndless-sdk:latest \
            bash -c 'export PATH=/ndless-sdk/bin:/ndless-sdk/toolchain/install/bin:$PATH && make && ls -la fb_touchscreen.tns'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb_touchscreen-tns
          path: tools/touchscreen_plugin/fb_touchscreen.tns
          if-no-files-found: error
